name: Update Pacman

on:
  schedule:
    - cron: "0 */24 * * *" # Se ejecuta cada 24 horas
  workflow_dispatch: # Permite ejecutar manualmente
  push:
    branches:
      - main
      - master
      - Inicio

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generar Pacman
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Jhona1836
          template: classic
          base: "" # No genera estadísticas extras, solo el juego
          plugin_languages: yes
          plugin_languages_sections: most-used
          # Configuración especial para activar el formato Pacman animado
          config_twemoji: yes
          plugin_pagespeed: no
